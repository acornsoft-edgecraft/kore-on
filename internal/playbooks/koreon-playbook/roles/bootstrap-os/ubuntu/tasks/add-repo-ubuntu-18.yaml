---
# For ubuntu     -------------------------------------------------------------
- name: Create keyrings directory if it does not exist
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Kubernetes APT GPG key
  ansible.builtin.apt_key:
    url: "{{ kubernetes_repo }}/deb/Release.key"
    state: present
    keyring: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

- name: Adding Kubernetes repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] {{ kubernetes_repo }}/deb/ /"
    state: present
    filename: kubernetes

- name: Add Docker-ce APT GPG key
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg
    state: present
    keyring: /etc/apt/keyrings/docker-ce-keyring.gpg

- name: Adding Docker-ce repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' if ansible_architecture == 'aarch64' }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ansible_distribution_release}} stable"
    state: present
    filename: docker

